const tk=j=>[[2.5,'2.5G+'],[10,'10G']].map(g=>`<label class="tk" title="Có ít nhất 1 cổng từ ${g[0]}GbE trở lên"><input type="checkbox" data-sp="${j}" data-g="${g[0]}"> ${g[1]}</label>`).join('');
$('#cfg').innerHTML=FIL.map((f,j)=>`<label for="fl${j}" style="padding:0">${f[0]}</label><div class="r2"><select id="fl${j}"><option value="0">Bất kỳ</option>${f[1].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>${f[3]?tk(j):''}</div>`).join('');
const mb=s=>/^\d+$/.test(s)?s+' Mbps':s;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtP=s=>esc(s).replace(/\s+(?=\*|-\s+P\d)/g,'<br>').replace(/([+-])\s+(P\d[\d,~]*)(?=\s|$)/g,'$1\u0001$2').replace(/\s+(?:\+\s+)?(?=P\d|WAN\d|Wan\d|\d+\s*x\s)/g,'<br>').replace(/\u0001/g,' ');
function match(i,q){if(!q)return true;const m=M[i];if((m.name+' '+m.note).toLowerCase().includes(q))return true;
 return Object.values(R).some(r=>{const v=(r.vals[i]||'').toLowerCase();return v.includes(q)||(r.label.toLowerCase().includes(q)&&has(r.vals[i]))})}
function render(){
 const iq=parseQ($('#q').value),q=iq.acts.length?'':$('#q').value.trim().toLowerCase(),fs=[...document.querySelectorAll('[data-f]:checked')].map(e=>e.dataset.f);
 const sd=$('#disc').checked,mins=FIL.map((f,j)=>+$('#fl'+j).value),sp=FIL.map((f,j)=>Math.max(0,...[...document.querySelectorAll(`[data-sp="${j}"]:checked`)].map(e=>+e.dataset.g)));
 const list=M.map((m,i)=>i).filter(i=>{if(!sd&&M[i].disc)return false;
  if(!FIL.every((f,j)=>(!mins[j]||(f[2](i)??0)>=mins[j])&&(!sp[j]||(f[3](i)??0)>=sp[j])))return false;
  return fs.every(k=>fHas(k,i))&&match(i,q)});
 const key={users:i=>M[i].users,nat:nat,wan:i=>M[i].wan}[$('#sort').value];
 if(key)list.sort((a,b)=>(key(b)??-1)-(key(a)??-1)||a-b);
 $('#count').textContent=`${list.length}/${N} model phù hợp`;
 const act=[];FEAT.forEach(f=>{if(fs.includes(f[0]))act.push([f[1],`data-ft="${f[0]}"`])});
 FIL.forEach((f,j)=>{const nm=f[0].replace(/ \(.*/,'');if(mins[j]){const o=f[1].find(o=>o[0]==mins[j]);act.push([nm+' '+(o?o[1]:''),`data-fl="${j}"`])}if(sp[j])act.push([nm.replace('Số cổng','Cổng')+' ≥ '+sp[j]+'GbE',`data-fs="${j}"`])});
 $('#act').innerHTML=act.map(a=>`<button class="ac" ${a[1]}>${esc(a[0])} ✕</button>`).join('');
 document.querySelectorAll('details.fg').forEach(d=>{const n=d.querySelectorAll('[data-f]:checked').length,b=d.querySelector('.n');b.hidden=!n;b.textContent=n});
 $('#grid').innerHTML=list.length?list.map(i=>{const m=M[i],c=p=>esc(cell(p,i)||'-');
  const ch=[...FEAT.filter(f=>fs.includes(f[0])&&fHas(f[0],i)).map(f=>`<span class="on">${f[1]}</span>`),...FEAT.filter(f=>!fs.includes(f[0])&&!UNI[f[0]]&&fHas(f[0],i)).map(f=>`<span>${f[1]}</span>`)].slice(0,8).join('');
  return `<article class="card${sel.has(i)?' sel':''}"><div><h3>${esc(m.name)}${m.disc?'<span class="badge">Ngừng sx</span>':''}</h3><div class="note">${esc(m.note)||'&nbsp;'}</div></div>
  <dl><dt>DrayOS</dt><dd>${c('DrayOS')}</dd><dt>NAT sessions</dt><dd>${c('NAT')}</dd><dt>NAT throughput</dt><dd>${esc(mb(cell('PPPoE',i))||'-')}</dd><dt>Chịu tải thực tế</dt><dd>${has(cell('Khả năng chịu tải',i))?c('Khả năng chịu tải')+' user':'-'}</dd><dt>Kênh VPN</dt><dd>${c('Tổng số kênh VPN')}</dd></dl>
  <div class="ports"><div><b>WAN:</b><br>${fmtP(cell('Số cổng WAN',i)||'-')}</div><div><b>LAN:</b><br>${fmtP(cell('Số cổng LAN',i)||'-')}</div></div><div class="chips">${ch}</div>
  <label class="pick"><input type="checkbox" data-s="${i}"${sel.has(i)?' checked':''}> Chọn để so sánh</label></article>`}).join(''):'<div class="empty">Không có model nào đáp ứng đủ điều kiện. Hãy bỏ bớt một bộ lọc.</div>';
 $('#bar').classList.toggle('on',sel.size>0);$('#bn').textContent=`Đã chọn ${sel.size}/4 model`;$('#go').disabled=sel.size<2;
}
function compare(){const ix=[...sel].sort((a,b)=>a-b),only=$('#only').checked;
 let h='<table><thead><tr><th>Tiêu chí</th>'+ix.map(i=>`<th>${esc(M[i].name)}<br><small>${esc(M[i].note)}</small></th>`).join('')+'</tr></thead><tbody>';
 D.groups.forEach(g=>{let b='';g.rows.forEach(r=>{const v=ix.map(i=>r.vals[i]||'');const d=new Set(v.map(x=>x.toLowerCase())).size>1;if(only&&!d)return;
  b+=`<tr class="${d?'diff':''}"><td>${esc(r.label)}</td>`+v.map(x=>x?`<td>${/^Số cổng (WAN|LAN)/.test(r.label)?fmtP(x):esc(x)}</td>`:'<td class="na">chưa có dữ liệu</td>').join('')+'</tr>'});
  if(b)h+=`<tr class="g"><td colspan="${ix.length+1}">${esc(g.title)}</td></tr>`+b});
 $('#tw').innerHTML=h+'</tbody></table>'}
document.addEventListener('input',e=>{if(e.target.dataset.s!==undefined)return;if(e.target.id==='only')return compare();render()});
$('#grid').addEventListener('change',e=>{const i=e.target.dataset.s;if(i===undefined)return;
 if(e.target.checked){if(sel.size>=4){e.target.checked=false;alert('Chọn tối đa 4 model để so sánh.');return}sel.add(+i)}else sel.delete(+i);render()});
$('#go').onclick=()=>{compare();$('#dlg').showModal()};$('#cl').onclick=()=>$('#dlg').close();
$('#clr').onclick=()=>{sel.clear();render()};
$('#reset').onclick=()=>{$('#q').value='';document.querySelectorAll('#f input[type=checkbox]').forEach(e=>e.checked=false);document.querySelectorAll('#cfg select').forEach(e=>e.value=0);$('#sort').value='';$('#disc').checked=false;render()};
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/,/g,'.');
const optFor=(j,v)=>FIL[j][1].find(o=>o[0]>=v)||FIL[j][1][FIL[j][1].length-1];
const nmOf=j=>FIL[j][0].replace(/ \(.*/,'');
const A={fil:(j,v)=>{const o=optFor(j,v);return{id:'fl'+j,label:nmOf(j)+' '+o[1],run:()=>{$('#fl'+j).value=o[0]}}},
spd:(j,g)=>({id:'sp'+j+g,label:nmOf(j).replace('Số cổng','Cổng')+' ≥ '+g+'GbE',run:()=>{document.querySelector(`[data-sp="${j}"][data-g="${g}"]`).checked=true}}),
feat:f=>({id:f[0],label:f[1],run:()=>{const c=document.querySelector(`[data-f="${f[0]}"]`);c.checked=true;c.closest('details').open=true}})};
const FK=k=>A.feat(FEAT.find(f=>f[0]===k));
function parseQ(raw){const t=nz(raw.trim()),acts=[],seen=new Set(),add=a=>{if(!seen.has(a.id)){seen.add(a.id);acts.push(a)}};if(t.length<2)return{acts};
 const re=r=>t.match(r);let m;
 if(m=re(/(\d+)\s*(user|nguoi|nhan vien|nv|may|thiet bi|client|pc)\b/))add(A.fil(0,+m[1]));
 const tp=(v,u)=>add(A.fil(1,+v*(/^g/.test(u||'')?1000:1)));
 if(m=re(/(\d+(?:\.\d+)?)\s*(gbps|mbps)/))tp(m[1],m[2]);
 else if(m=re(/(\d+(?:\.\d+)?)\s*(g|gb|m|mb)\s*(?:internet|bang thong|toc do|goi cuoc)/))tp(m[1],m[2]);
 else if(m=re(/(?:internet|bang thong|toc do|goi cuoc)\s*(\d+(?:\.\d+)?)\s*(g|gb|m|mb)\b/))tp(m[1],m[2]);
 if(m=re(/(\d+)\s*(wan|duong truyen|duong mang|line|nha mang|isp)\b/))add(A.fil(2,+m[1]));
 if(m=re(/(\d+)\s*(lan|cong lan)\b/))add(A.fil(3,+m[1]));
 if(m=re(/(\d+)\s*(vpn|kenh vpn|tunnel|chi nhanh)\b/))add(A.fil(4,+m[1]));
 if(m=re(/(\d+)\s*(k|nghin)?\s*(session|phien)\b/))add(A.fil(5,+m[1]*(m[2]?1000:1)));
 if(!seen.has('fl1')&&(m=re(/\b(2\.5|10)\s*(g|gb|gbe)\b/))){const g=+m[1],l=/\blan\b/.test(t),w=/wan/.test(t);if(w||!l)add(A.spd(2,g));if(l)add(A.spd(3,g))}
 FEAT.forEach(f=>{if([nz(f[1]),...(ALIAS[f[0]]||[])].some(w=>new RegExp('(^|[^a-z0-9])'+w.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+'($|[^a-z0-9])').test(t)))add(A.feat(f))});
 if(/quan cafe|ca phe|nha hang|khach san|homestay|resort|cua hang|quan an/.test(t))add(FK('Wi-Fi Marketing'));
 if(/chi nhanh|site to site|van phong con/.test(t))add(A.fil(4,50));
 if(/rot mang|mat mang|du phong mang/.test(t)){add(A.fil(2,2));add(FK('Load-Balance (IP'))}
 return{acts,t}}
let cur=[],hl=0;
function paint(){const b=$('#sug');b.innerHTML=cur.map((c,k)=>`<button type="button" class="si${c.all?' all':''}${k===hl?' hl':''}" data-k="${k}">${esc(c.label)}${c.sub?` <small>· ${c.sub}</small>`:''}</button>`).join('');b.classList.toggle('on',cur.length>0)}
function suggest(){const raw=$('#q').value,{acts,t}=parseQ(raw);cur=[];hl=0;
 if(acts.length>1)cur.push({label:'Áp dụng tất cả: '+acts.map(a=>a.label).join(' · '),all:1,run:()=>acts.forEach(a=>a.run())});
 acts.forEach(a=>cur.push({label:a.label,sub:'áp dụng bộ lọc',run:a.run}));
 if(t){const last=t.split(/\s+/).pop();
  if(last.length>1)FEAT.filter(f=>!acts.some(a=>a.id===f[0])&&(nz(f[1]).includes(last)||(ALIAS[f[0]]||[]).some(w=>w.startsWith(last)))).slice(0,3).forEach(f=>cur.push({label:f[1],sub:'tính năng',run:A.feat(f).run}));
  M.forEach(m=>{if(nz(m.name).includes(t))cur.push({label:m.name,sub:'model',keep:1,run:()=>{$('#q').value=m.name}})})}
 cur=cur.slice(0,8);if(!cur.length&&raw.trim().length>1)cur.push({label:`Tìm theo từ khoá "${raw.trim()}"`,sub:'đang lọc theo chữ',keep:1,run:()=>{}});paint()}
function pick(k){const c=cur[k];if(!c)return;c.run();if(!c.keep)$('#q').value='';cur=[];paint();render()}
$('#q').addEventListener('input',suggest);$('#q').addEventListener('focus',suggest);$('#q').addEventListener('blur',()=>$('#sug').classList.remove('on'));
$('#q').addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(cur.length){hl=(hl+(e.key==='ArrowDown'?1:cur.length-1))%cur.length;paint();e.preventDefault()}}
 else if(e.key==='Enter'&&cur.length){pick(hl);e.preventDefault()}else if(e.key==='Escape'){cur=[];paint()}});
$('#sug').addEventListener('mousedown',e=>{e.preventDefault();const b=e.target.closest('.si');if(b)pick(+b.dataset.k)});
$('#act').addEventListener('click',e=>{const b=e.target.closest('.ac');if(!b)return;const d=b.dataset;
 if(d.ft!==undefined)document.querySelector(`[data-f="${d.ft}"]`).checked=false;if(d.fl!==undefined)$('#fl'+d.fl).value=0;
 if(d.fs!==undefined)document.querySelectorAll(`[data-sp="${d.fs}"]`).forEach(c=>c.checked=false);render()});
$('#notes').innerHTML=D.notes.map(esc).join('<br>');render();
</script></body></html>
