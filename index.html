<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>So sánh router DrayTek</title>
<style>
:root{--navy:#1B2A4A;--org:#F37021;--red:#E2231A;--bg:#F4F6F9;--card:#fff;--line:#DDE3EC;--mute:#667388}
*{box-sizing:border-box}html{scroll-padding-top:110px}
body{margin:0;font:15px/1.5 Arial,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--navy);padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--navy);color:#fff;padding:18px 20px 14px;position:sticky;top:0;z-index:5;padding-top:calc(18px + env(safe-area-inset-top,0))}
header h1{margin:0;font-size:20px}header small{color:#B9C4D8}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#q{width:100%;padding:10px 12px;border:0;border-radius:6px;font-size:15px}
main{display:grid;grid-template-columns:280px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:20px}
aside{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;align-self:start;position:sticky;top:116px;max-height:calc(100vh - 130px);overflow:auto}
aside h2{font-size:14px;margin:14px 0 6px}aside h2:first-child{margin-top:0}
aside label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
select{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:14px;color:var(--navy)}
button{font:inherit;cursor:pointer}.link{background:none;border:0;color:var(--org);padding:0;text-decoration:underline}
#count{color:var(--mute)}.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar2 #count{margin:0}.bar2 label{display:flex;gap:8px;align-items:center;font-size:14px}.bar2 select{width:auto;margin:0}
.sb{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}.dsc{display:flex;gap:6px;align-items:center;font-size:13px;color:#DCE4F2;cursor:pointer}
.r2{display:flex;gap:8px;align-items:center;margin-bottom:6px}.r2 select{flex:1;margin:0;min-width:0}.tk{white-space:nowrap;font-size:13px;padding:0!important}
.hint{font-size:12px;color:var(--mute);margin:2px 0 0}.ports div+div{margin-top:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.sel{border-color:var(--org);box-shadow:0 0 0 2px var(--org)}
.card h3{margin:0;font-size:18px}.note{color:var(--mute);font-size:12px}
.badge{background:var(--red);color:#fff;border-radius:4px;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
.card dt{color:var(--mute)}.card dd{margin:0;font-weight:700;text-align:right}
.ports{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips span{background:#EAF0F8;border-radius:10px;padding:1px 8px;font-size:11px}
.pick{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:auto;cursor:pointer;padding-top:4px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0));display:none;align-items:center;gap:14px;z-index:6}
#bar.on{display:flex}#bar .go{background:var(--org);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-weight:700;margin-left:auto}
#bar .go:disabled{opacity:.5}#bar .link{color:#B9C4D8}
dialog{width:min(1200px,96vw);height:92vh;border:0;border-radius:10px;padding:0;overflow:hidden}
dialog::backdrop{background:rgba(27,42,74,.6)}
.dh{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:17px;flex:1}.dh button.x{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:6px 14px}
.tw{overflow:auto;height:calc(92vh - 58px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:130px;text-align:left}
th:first-child,td:first-child{position:sticky;left:0;background:#fff;min-width:170px;z-index:1;font-weight:700}
thead th{position:sticky;top:0;background:var(--navy);color:#fff;z-index:2}
thead th:first-child{background:var(--navy);z-index:3}
tr.g td{background:var(--bg);font-weight:700;color:var(--navy)}
tr.diff td:first-child{box-shadow:inset 4px 0 var(--org)}tr.diff td{background:#FFF6EE}
.na{color:#99A3B5}.empty{padding:30px;text-align:center;color:var(--mute);background:var(--card);border-radius:8px}
footer{max-width:1280px;margin:0 auto;padding:0 20px 90px;color:var(--mute);font-size:12px}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
@media(max-width:820px){main{grid-template-columns:1fr;padding:12px}aside{position:static;max-height:none}header{position:static}}

  b+=`<tr class="${d?'diff':''}"><td>${esc(r.label)}</td>`+v.map(x=>x?`<td>${/^Số cổng (WAN|LAN)/.test(r.label)?fmtP(x):esc(x)}</td>`:'<td class="na">chưa có dữ liệu</td>').join('')+'</tr>'});
  if(b)h+=`<tr class="g"><td colspan="${ix.length+1}">${esc(g.title)}</td></tr>`+b});
 $('#tw').innerHTML=h+'</tbody></table>'}
document.addEventListener('input',e=>{if(e.target.dataset.s!==undefined)return;if(e.target.id==='only')return compare();render()});
$('#grid').addEventListener('change',e=>{const i=e.target.dataset.s;if(i===undefined)return;
 if(e.target.checked){if(sel.size>=4){e.target.checked=false;alert('Chọn tối đa 4 model để so sánh.');return}sel.add(+i)}else sel.delete(+i);render()});
$('#go').onclick=()=>{compare();$('#dlg').showModal()};$('#cl').onclick=()=>$('#dlg').close();
$('#clr').onclick=()=>{sel.clear();render()};
$('#reset').onclick=()=>{$('#q').value='';document.querySelectorAll('#f input[type=checkbox]').forEach(e=>e.checked=false);document.querySelectorAll('#cfg select').forEach(e=>e.value=0);$('#sort').value='';$('#disc').checked=false;render()};
$('#notes').innerHTML=D.notes.map(esc).join('<br>');render();
</script></body></html>
